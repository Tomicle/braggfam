<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bragg Family</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&amp;family=Nunito:wght@400;700&amp;family=Passion+One:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --canyon: #C1440E;
    --rust: #8A3324;
    --sand: #EFD4A6;
    --sand-light: #FBF1DE;
    --sage: #6E7F5C;
    --teal: #2E6E6A;
    --paper: #FBF1DE;
    --ink: #3A2A1E;
    --gold: #E0A83E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.25rem;
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    line-height:1.55;
    text-align:center;
  }
  main{max-width:34rem;}
  h1{
    font-family:'Passion One', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:0 0 0.5rem;
    font-size:clamp(2.25rem, 8vw, 3.5rem);
    line-height:1.05;
    color:var(--canyon);
  }
  .script{
    font-family:'Caveat', cursive;
    font-size:clamp(1.5rem, 5vw, 2rem);
    color:var(--teal);
    margin:0 0 1.5rem;
  }
  p{margin:0 0 1rem; font-size:1.1rem;}
  .rule{
    width:4rem;
    height:4px;
    margin:0 auto 1.5rem;
    background:var(--gold);
    border-radius:2px;
  }
</style>
</head>
<body>
<main>
  <h1>Bragg Family</h1>
  <p class="script">Nothing happening right now.</p>
  <div class="rule"></div>
  <p>Come back later.</p>
</main>
</body>
</html>
